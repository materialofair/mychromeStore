# Include inside your HTTPS server block (configure TLS certificates separately).
# Build with STORE_ORIGIN=https://your-host.example.com.
# Start with that STORE_ORIGIN and TRUST_PROXY=1 for this loopback proxy.
# Never expose .data/ or the repository as a static root.
client_max_body_size 32m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Backend uses configured STORE_ORIGIN, not forwarded headers, for CSRF.
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
}
