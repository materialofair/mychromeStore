<!doctype html><html><head><style>body{font:16px system-ui;padding:16px;background:#edf3f6}h2{color:rgb(20,80,120)}input{max-width:100%;box-sizing:border-box}button{padding:10px;margin:4px}</style></head><body>
<h2>JS Calculator</h2><input id="a" type="number" value="2"><input id="b" type="number" value="3"><button id="add">Add</button><button id="multiply">Multiply</button><output id="answer"></output>
<script>(async()=>{const old=await spaceTool.loadState();let s=old||{a:2,b:3,result:5};const a=document.getElementById('a'),b=document.getElementById('b'),answer=document.getElementById('answer');a.value=s.a;b.value=s.b;function render(){answer.textContent=s.result;spaceTool.setResult({summary:'Calculator result: '+s.result,data:s});}function save(){spaceTool.saveState(s).catch(e=>answer.textContent=e.message);}a.oninput=()=>{s.a=Number(a.value);save()};b.oninput=()=>{s.b=Number(b.value);save()};document.getElementById('add').onclick=()=>{s.result=s.a+s.b;render();save()};document.getElementById('multiply').onclick=()=>{s.result=s.a*s.b;render();save()};render();save();})();</script></body></html>
