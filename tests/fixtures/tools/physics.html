<!doctype html><html><head><style>body{font:16px system-ui;padding:16px}canvas{max-width:100%;background:#eef1fb}button{padding:10px;margin:4px}</style></head><body><h2>Bouncing ball simulation</h2><canvas width="400" height="200"></canvas><p>Steps <output id="steps"></output></p><button id="run">Run</button><button id="stop">Stop</button><button id="step">Step</button>
<script>(async()=>{let s=await spaceTool.loadState()||{x:20,y:20,vx:35,vy:0,steps:0,time:0};let running=false,last=0;const ctx=document.querySelector('canvas').getContext('2d'),out=document.getElementById('steps');function draw(){ctx.clearRect(0,0,400,200);ctx.fillStyle='#5864ae';ctx.beginPath();ctx.arc(s.x,s.y,10,0,Math.PI*2);ctx.fill();out.textContent=s.steps;spaceTool.setResult({summary:'Ball at t='+s.time.toFixed(2),data:s});spaceTool.saveState(s);}function step(){let dt=.02;s.vy+=98*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.y>190){s.y=190;s.vy=-s.vy*.85}if(s.x>390||s.x<10)s.vx=-s.vx;s.steps++;s.time+=dt;draw();}function loop(t){if(!running)return;if(t-last>30){last=t;step()}requestAnimationFrame(loop)}document.getElementById('run').onclick=()=>{if(!running){running=true;requestAnimationFrame(loop)}};document.getElementById('stop').onclick=()=>{running=false;draw()};document.getElementById('step').onclick=step;spaceTool.onPause(()=>{running=false;draw()});draw();})();</script></body></html>
