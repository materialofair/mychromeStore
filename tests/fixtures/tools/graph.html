<!doctype html><html><head><style>body{font:16px system-ui;padding:16px}canvas{max-width:100%;background:#e6f4ed}label{display:block}</style></head><body><h2>Dynamic sine chart</h2><label>Gain<input id="gain" type="range" min="1" max="5" value="1"></label><output id="value"></output><canvas width="400" height="180"></canvas>
<script>(async()=>{let s=await spaceTool.loadState()||{gain:1};const gain=document.getElementById('gain'),value=document.getElementById('value'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');gain.value=s.gain;function draw(){value.textContent=s.gain;ctx.clearRect(0,0,400,180);ctx.strokeStyle='#267658';ctx.beginPath();for(let x=0;x<=400;x++){let y=90-Math.sin(x/30)*s.gain*15;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();spaceTool.setResult({summary:'Sine wave gain '+s.gain,data:{gain:s.gain,samples:Array.from({length:40},(_,x)=>[x,Math.sin(x/3)*s.gain])}});spaceTool.saveState(s);}gain.oninput=()=>{s.gain=Number(gain.value);draw()};draw();})();</script></body></html>
