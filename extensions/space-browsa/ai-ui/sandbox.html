<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI UI</title><style>body{max-width:720px;margin:0 auto;font:14px system-ui;padding:16px;color:#24312d;background:#f5f7f4}button,input,select,textarea{font:inherit;margin:4px;padding:8px}button{cursor:pointer}#ui *{box-sizing:border-box;min-width:0}#ui input,#ui select,#ui textarea{max-width:100%;margin:4px 0}canvas{display:block;max-width:100%;height:auto}#controls{position:sticky;top:0;background:#f5f7f4}#notice{font-size:12px;color:#58665f}</style><script src="program.js" defer></script><script src="sandbox.js" defer></script></head><body><p id="notice">仅本地交互；脚本、链接及外部资源已移除。</p><div id="controls" hidden><button id="run">运行模拟</button><button id="stop">停止</button><button id="step">单步</button><button id="reset">重置</button></div><main id="ui"></main></body></html>
